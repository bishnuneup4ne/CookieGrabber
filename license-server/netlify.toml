# Netlify site config for the JohnWick licence server.
# This file MUST sit at the root of whatever directory/folder you point Netlify
# at. Deploy with `netlify deploy` from inside license-server/, or set the base
# directory to license-server/ in the Netlify UI if deploying from the repo root.

[build]
  # No build step; this is a pure functions site. publish is an empty static dir.
  publish = "public"

# Clean URL: /api/license -> the function. Without this the function lives at
# /.netlify/functions/license and your cfg.json licence_url must use that path.
[[redirects]]
  from = "/api/license"
  to = "/.netlify/functions/license"
  status = 200
  force = true
