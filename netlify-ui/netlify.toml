# netlify.toml for the JohnWick UI (static site).
# Deploy THIS folder (netlify-ui/) to Netlify. It's pure static HTML/JS -- no build step.
# The heavy lifting (auth, users, builds) happens on the Cloudflare Worker; this site
# just talks to it via config.js -> window.JWG_API.

[build]
  publish = "."
  # No command: nothing to compile.

# SPA fallback so any path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
